name: PaceMap Daily Pipeline

on:
  schedule:
    # 17:30 UTC = 6:30pm BST in summer, 5:30pm GMT in winter.
    # pipeline.py treats any run from 17:00 UK time as 'tomorrow'.
    - cron: '30 17 * * *'
    # 12:05am UK time (23:05 UTC in BST)
    - cron: '5 23 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz openpyxl python-docx

      # Horse form comes from a local results cache (the per-horse results
      # endpoint is Pro-only). Restore the latest cache, top it up during the
      # run, and save it back. The first run with no cache backfills 12 months
      # of GB/IRE results (roughly 270 API calls, 3-5 minutes).
      - name: Restore results cache
        uses: actions/cache@v4
        with:
          path: results_cache
          key: results-cache-${{ github.run_id }}
          restore-keys: |
            results-cache-

      - name: Run PaceMap pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          RACING_API_USER: ${{ secrets.RACING_API_USER }}
          RACING_API_PASS: ${{ secrets.RACING_API_PASS }}
        run: |
          python pipeline.py

      - name: Log completion
        if: always()
        run: |
          echo "Pipeline completed at $(date -u)"
