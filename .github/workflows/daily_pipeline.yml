name: PaceMap Daily Pipeline

on:
  schedule:
    # 6:30pm UK time (BST = UTC+1, so 17:30 UTC in summer)
    - cron: '30 17 * * *'
    # 12:05am UK time (23:05 UTC in BST)
    - cron: '5 23 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pytz openpyxl python-docx

      - name: Run PaceMap pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}
          RACING_API_USER: ${{ secrets.RACING_API_USER }}
          RACING_API_PASS: ${{ secrets.RACING_API_PASS }}
        run: |
          python pipeline.py

      - name: Log completion
        if: always()
        run: |
          echo "Pipeline completed at $(date -u)"
